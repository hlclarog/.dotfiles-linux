# Hardening for the sshd that Moshi and Mosh connect through.
#
# Mirrored networking puts this machine on the real LAN, so the SSH port is
# reachable from every other device on the network. Moshi authenticates with a
# per-device ED25519 key that it appends to ~/.ssh/authorized_keys during
# pairing, so password authentication is not merely unnecessary here, it is the
# only remaining way in that can be brute forced.
#
# Installed to /etc/ssh/sshd_config.d/ by restoration_scripts/10-moshi-remote.sh,
# as 00-moshi.conf rather than 99-moshi.conf. sshd reads sshd_config.d/*.conf in
# lexical order and keeps the FIRST value it sees for each keyword, so a drop-in
# named 99-* loses to anything sorting earlier -- on Ubuntu 24.04, cloud-init
# writes PasswordAuthentication yes to 50-cloud-init.conf whenever the image is
# installed with a password, and 99-moshi.conf never wins that race. The 00-
# prefix sorts before 50-cloud-init.conf, so this hardening applies instead.
PasswordAuthentication no
PubkeyAuthentication yes
