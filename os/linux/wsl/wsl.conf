[boot]
systemd=true

[user]
default=__WSL_USER__

[automount]
# metadata stores real permissions in NTFS extended attributes. Without it every
# file under /mnt reads as 777 and git reports phantom mode changes.
#
# fmask=11 rather than 111: the execute bit has to survive, or nothing on the
# Windows drives can run - including the VS Code WSL extension's wslServer.sh,
# which fails with "Permission denied". Git is told to ignore the bit instead,
# in git/config-windows-drives, scoped to gitdir:/mnt.
options="metadata,umask=22,fmask=11"
