- clean: ['~']

- defaults:
    link:
      create: true
      force: true

- create:
    - $DOTFILES_PATH/shell/bash/completions
    - $DOTFILES_PATH/shell/bash/themes

- link:
    ~/.bash_profile: shell/bash/.bash_profile
    ~/.bashrc: shell/bash/.bashrc
    ~/.zshenv: shell/zsh/.zshenv
    ~/.zshrc: shell/zsh/.zshrc
    ~/.inputrc: shell/.inputrc
    ~/.gitconfig: git/config
    ~/.claude/statusline-command.sh: tools/claude-code/statusline-command.sh
    ~/.config/starship.toml: config/starship.toml
    ~/.config/herdr/config.toml: config/herdr/config.toml
    ~/.config/nvim: config/nvim
    ~/.config/atuin/config.toml: config/atuin/config.toml
    ~/.ssh/config: ssh/config
    # herdr looks for `paplay` first among the Linux player names, so the shim
    # is installed under that name. Both links point at the same script.
    ~/.local/bin/herdr-mp3-shim: tools/herdr/herdr-mp3-shim
    ~/.local/bin/paplay: tools/herdr/herdr-mp3-shim
