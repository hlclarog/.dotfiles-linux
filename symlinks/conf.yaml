- clean: ['~']

- defaults:
    link:
      create: true
      force: true

- create:
    - $DOTFILES_PATH/shell/bash/completions
    - $DOTFILES_PATH/shell/bash/themes

- link:
    ~/.bash_profile: shell/bash/.bash_profile
    ~/.bashrc: shell/bash/.bashrc
    ~/.zshenv: shell/zsh/.zshenv
    ~/.zshrc: shell/zsh/.zshrc
    ~/.inputrc: shell/.inputrc
    ~/.gitconfig: git/config
    ~/.claude/statusline-command.sh: tools/claude-code/statusline-command.sh
    ~/.config/starship.toml: config/starship.toml
    ~/.config/herdr/config.toml: config/herdr/config.toml
    ~/.config/nvim: config/nvim
    ~/.config/atuin/config.toml: config/atuin/config.toml
    # Only config.toml is linked. ~/.config/moshi also holds
    # claude-identity.json and host-pairings.json, per-install host credentials
    # that must stay out of a public repo.
    ~/.config/moshi/config.toml: config/moshi/config.toml
    ~/.config/nushell/config.nu: config/nushell/config.nu
    ~/.ssh/config: ssh/config
    # herdr looks for `paplay` first among the Linux player names, so the shim
    # is installed under that name. Both links point at the same script.
    ~/.local/bin/herdr-mp3-shim: tools/herdr/herdr-mp3-shim
    ~/.local/bin/paplay: tools/herdr/herdr-mp3-shim
    # Relabels worktree workspaces by their branch; herdr names them after the
    # directory, which for a generated worktree says nothing about the work.
    ~/.local/bin/herdr-worktree-labels: tools/herdr/herdr-worktree-labels
    # `codegraph` must NOT be a symlink to the npm shim. The shim's shebang is
    # `#!/usr/bin/env node`, so an absolute path to it still dies wherever Node
    # is not on PATH. The wrapper supplies both the shim and a Node.
    ~/.local/bin/codegraph: tools/codegraph/codegraph
    # Shared by the Claude Code and Codex SessionStart hooks.
    ~/.local/bin/codegraph-session-reminder: tools/codegraph/codegraph-session-reminder
    # opencode has no session-hook file, so the same reminder arrives as a plugin.
    ~/.config/opencode/plugins/codegraph-index-reminder.ts: tools/codegraph/codegraph-index-reminder.ts
